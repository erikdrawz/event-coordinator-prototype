# Local development stack (`supabase start`). Hosted projects are configured in the dashboard.
project_id = "event-coordinator-prototype"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
# Must stay true: false here disables the email provider, logins included.
# Sign-ups are already blocked by [auth] enable_signup = false.
enable_signup = true
enable_confirmations = false
